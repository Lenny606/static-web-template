name: Deploy via SCP

on:
  push:
    branches:
      - dbda
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Copy Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: ".,!.git,!.github,!.agent,!.agents,!.idea,!.vscode,!.gitignore,!.dockerignore,!node_modules,!infrastructure/,!assets/images/projects/original,!assets/references,!package.json,!package-lock.json,!tailwind.config.js,!README.md,!scripts/,!*.md,!assets/images/projects-new/projects.json"
          target: ${{ secrets.DEPLOY_TARGET }}
          strip_components: 0
          overwrite: true
