name: Deploy via SCP

on:
  push:
    branches:
      - main
      - feat/design-refactor
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Copy Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: ".,!assets/images/projects/original,!assets/references,!infrastructure/,!node_modules"
          target: ${{ github.ref_name == 'main' && '/var/www/html/sites/jenkostudio/public' || '/var/www/html/sites/dev/public' }}
          strip_components: 0
          overwrite: true
